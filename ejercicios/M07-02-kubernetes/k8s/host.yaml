# Host: su propio Deployment y un Service NodePort, la entrada desde fuera del clúster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: host
spec:
  replicas: 1
  selector:
    matchLabels: { app: host }
  template:
    metadata:
      labels: { app: host }
    spec:
      containers:
        - name: host
          image: host:1
          imagePullPolicy: IfNotPresent
          env:
            - name: SALUDO_URL
              value: http://saludo     # el Service del remote
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: host
spec:
  type: NodePort
  selector: { app: host }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080                # kind.yaml lo publica como localhost:8080
